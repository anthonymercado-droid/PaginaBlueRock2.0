<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/Tienda.css">
    <title>Blue Rock - Tienda</title>
</head>
<body>

    <header>
        <div class="logo">
            <a href="index.html">  
                <h1 class="titulo-logo">Blue Rock</h1>
            </a>
            <p>BELLEZA • CONFIANZA • BIENESTAR</p>
        </div>
        <button id="cart-icon-btn" class="cart-icon-btn" onclick="toggleCart()">
            🛒 Carrito <span id="cart-count">0</span>
        </button>
    </header>

    <main class="shop-container">
        <div class="shop-header">
            <h2>Nuestros Productos</h2>
            <p>Cuidado facial profesional directo a tu rutina diaria</p>
        </div>
        <div id="products-grid" class="products-grid">
            <div class="loading-state">Cargando productos de Blue Rock...</div>
        </div>
    </main>

    <!-- OVERLAY Y SIDEBAR DEL CARRITO -->
    <div id="cart-overlay" class="cart-overlay" onclick="toggleCart()"></div>
    
    <aside id="cart-sidebar" class="cart-sidebar">
        <div class="cart-header">
            <h3>Tu Carrito</h3>
            <button class="close-cart" onclick="toggleCart()">&times;</button>
        </div>
        <div id="cart-items" class="cart-items"></div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cart-total-price">$0.00</span>
            </div>
            <button class="btn-checkout" onclick="procesarCompra()">Finalizar Compra</button>
        </div>
    </aside>

    <!-- MODAL DE SELECCIÓN DE MÉTODO DE PAGO -->
    <div id="payment-modal" class="modal-overlay">
        <div class="modal-card">
            <h3>Finalizar Compra</h3>
            <p>Selecciona tu método de pago para registrar la orden:</p>
            
            <div class="payment-options">
                <label class="payment-option">
                    <input type="radio" name="metodo_pago" value="Efectivo" checked>
                    <span>Efectivo</span>
                </label>
                <label class="payment-option">
                    <input type="radio" name="metodo_pago" value="Transferencia">
                    <span>Transferencia Bancaria</span>
                </label>
            </div>

            <div class="modal-actions">
                <button type="button" class="btn-cancel" onclick="cerrarModalPago()">Cancelar</button>
                <button type="button" class="btn-confirm" onclick="confirmarCompra()">Confirmar Pedido</button>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
        getFirestore, 
        collection, 
        getDocs, 
        addDoc, 
        doc, 
        updateDoc, 
        increment, 
        serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // CONFIGURACIÓN DE BLUEROCK
    const firebaseConfig = {
        apiKey: "AIzaSyArRVa6N2XNwdYQKiR7drCqECMczH-JPQ0",
        authDomain: "bluerock-ee20b.firebaseapp.com",
        projectId: "bluerock-ee20b",
        storageBucket: "bluerock-ee20b.firebasestorage.app",
        messagingSenderId: "944470168965",
        appId: "1:944470168965:web:2d7cfd42773b9573d060ec"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let productosCache = [];
    let carrito = JSON.parse(localStorage.getItem('cart_bluerock')) || [];
    let usuarioActual = null;

    // Escuchar el estado de autenticación para obtener el ID del cliente
    onAuthStateChanged(auth, (user) => {
        if (user) {
            usuarioActual = user;
        }
    });

    // 1. Cargar productos desde Firestore
    async function cargarProductos() {
        const gridContainer = document.getElementById('products-grid');
        try {
            const querySnapshot = await getDocs(collection(db, "productos"));
            
            if (querySnapshot.empty) {
                gridContainer.innerHTML = '<p class="empty-state">No hay productos disponibles actualmente.</p>';
                return;
            }

            gridContainer.innerHTML = '';
            productosCache = [];

            querySnapshot.forEach((docSnap) => {
                const producto = { id: docSnap.id, ...docSnap.data() };
                const precioNumerico = Number(producto.precio || 0);
                const stockDisponible = Number(producto.stock || 0);
                producto.precio = precioNumerico;
                producto.stock = stockDisponible;
                productosCache.push(producto);
                
                const productCard = document.createElement('div');
                productCard.className = 'product-card';
                productCard.innerHTML = `
                    <div class="product-image-wrap">
                        <img src="${producto.imagen || 'https://via.placeholder.com/300'}" alt="${producto.nombre}">
                    </div>
                    <div class="product-info">
                        <span class="product-category">${producto.categoria || 'Cosmética'}</span>
                        <h3 class="product-title">${producto.nombre || 'Producto'}</h3>
                        <p class="product-description">${producto.descripcion || ''}</p>
                        <div class="product-bottom">
                            <span class="product-price">$${precioNumerico.toFixed(2)}</span>
                            <button class="btn-add" 
                                    onclick="agregarAlCarrito('${producto.id}')" 
                                    ${stockDisponible <= 0 ? 'disabled' : ''}>
                                ${stockDisponible > 0 ? 'Agregar' : 'Agotado'}
                            </button>
                        </div>
                    </div>
                `;
                gridContainer.appendChild(productCard);
            });
            actualizarCarritoUI();
        } catch (error) {
            console.error("Error Firestore:", error);
            gridContainer.innerHTML = '<p class="error-state">Error al cargar la tienda. Revisa la conexión.</p>';
        }
    }

    // 2. Funciones del Carrito
    window.agregarAlCarrito = function(id) {
        const producto = productosCache.find(p => p.id === id);
        if (!producto) return;

        const existe = carrito.find(item => item.id === id);
        if (existe) {
            if (producto.stock && existe.cantidad >= producto.stock) {
                alert(`Solo quedan ${producto.stock} unidades disponibles.`);
                return;
            }
            existe.cantidad++;
        } else {
            carrito.push({
                id: producto.id,
                nombre: producto.nombre,
                precio: producto.precio,
                imagen: producto.imagen,
                cantidad: 1
            });
        }
        guardarYActualizar();
        abrirCarrito();
    };

    window.cambiarCantidad = function(id, cambio) {
        const item = carrito.find(p => p.id === id);
        if (!item) return;

        const productoBase = productosCache.find(p => p.id === id);
        if (cambio > 0 && productoBase && item.cantidad >= productoBase.stock) {
            alert(`Solo quedan ${productoBase.stock} unidades disponibles.`);
            return;
        }

        item.cantidad += cambio;
        if (item.cantidad <= 0) {
            carrito = carrito.filter(p => p.id !== id);
        }
        guardarYActualizar();
    };

    window.eliminarDelCarrito = function(id) {
        carrito = carrito.filter(item => item.id !== id);
        guardarYActualizar();
    };

    window.toggleCart = function() {
        document.getElementById('cart-sidebar').classList.toggle('active');
        document.getElementById('cart-overlay').classList.toggle('active');
    };

    function abrirCarrito() {
        document.getElementById('cart-sidebar').classList.add('active');
        document.getElementById('cart-overlay').classList.add('active');
    }

    function guardarYActualizar() {
        localStorage.setItem('cart_bluerock', JSON.stringify(carrito));
        actualizarCarritoUI();
    }

    function actualizarCarritoUI() {
        const container = document.getElementById('cart-items');
        const countLabel = document.getElementById('cart-count');
        const totalLabel = document.getElementById('cart-total-price');
        const totalItems = carrito.reduce((sum, item) => sum + item.cantidad, 0);
        countLabel.textContent = totalItems;

        if (carrito.length === 0) {
            container.innerHTML = '<p class="empty-cart-msg">Tu carrito está vacío.</p>';
            totalLabel.textContent = '$0.00';
            return;
        }

        container.innerHTML = '';
        let totalAcumulado = 0;

        carrito.forEach(item => {
            totalAcumulado += (item.precio * item.cantidad);
            const itemDiv = document.createElement('div');
            itemDiv.className = 'cart-item';
            itemDiv.innerHTML = `
                <img src="${item.imagen}" alt="${item.nombre}">
                <div class="cart-item-details">
                    <h4>${item.nombre}</h4>
                    <p class="cart-item-price">$${item.precio.toFixed(2)}</p>
                    <div class="cart-quantity-controls">
                        <button onclick="cambiarCantidad('${item.id}', -1)">-</button>
                        <span>${item.cantidad}</span>
                        <button onclick="cambiarCantidad('${item.id}', 1)">+</button>
                    </div>
                </div>
                <button class="btn-remove" onclick="eliminarDelCarrito('${item.id}')">&times;</button>
            `;
            container.appendChild(itemDiv);
        });
        totalLabel.textContent = `$${totalAcumulado.toFixed(2)}`;
    }

    // 3. Proceso de Pago y Guardado en Firestore ('detalleProducto')
    window.procesarCompra = function() {
        if (carrito.length === 0) return;
        document.getElementById('payment-modal').classList.add('active');
    };

    window.cerrarModalPago = function() {
        document.getElementById('payment-modal').classList.remove('active');
    };

    window.confirmarCompra = async function() {
        const btnConfirmar = document.querySelector('.btn-confirm');
        btnConfirmar.disabled = true;
        btnConfirmar.textContent = "Procesando...";

        const metodoPago = document.querySelector('input[name="metodo_pago"]:checked').value;
        const totalCalculado = carrito.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);

        // Obtener IDs para la relación en detalleProducto
        const idCliente = usuarioActual ? usuarioActual.uid : "";
        const idCompra = sessionStorage.getItem("citaIdActual") || "";

        const productosLlevar = carrito.map(item => ({
            id: item.id,
            nombre: item.nombre,
            cantidad: item.cantidad,
            precioUnitario: item.precio
        }));

        try {
            // 1. Guardar el pedido en la colección "detalleProducto"
            await addDoc(collection(db, "detalleProducto"), {
                idCliente: idCliente,
                idCompra: idCompra,
                productos: productosLlevar,
                metodoPago: metodoPago,
                total: totalCalculado,
                estado: "Pendiente",
                fechaCreacion: serverTimestamp()
            });

            // 2. Reducir el stock de cada producto en la colección "productos"
            const promesasStock = carrito.map(item => {
                const productoRef = doc(db, "productos", item.id);
                return updateDoc(productoRef, {
                    stock: increment(-item.cantidad)
                });
            });

            await Promise.all(promesasStock);

            alert(`¡Pedido registrado exitosamente!\nMétodo de pago seleccionado: ${metodoPago}`);

            // 3. Limpiar carrito y recargar productos
            carrito = [];
            guardarYActualizar();
            cerrarModalPago();
            toggleCart();
            await cargarProductos();

        } catch (error) {
            console.error("Error al procesar la compra o actualizar stock:", error);
            alert("Ocurrió un error al procesar tu compra. Por favor, intenta de nuevo.");
        } finally {
            btnConfirmar.disabled = false;
            btnConfirmar.textContent = "Confirmar Pedido";
        }
    };

    window.addEventListener('DOMContentLoaded', cargarProductos);
</script>
</body>
</html>
