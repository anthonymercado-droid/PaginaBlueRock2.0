<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Fuentes Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Archivo CSS -->
    <link rel="stylesheet" href="css/Tienda.css">
</head>
<body>

    <header>
        <div class="logo">
            <a href="index.html">  
                <h1 class="titulo-logo">Blue Rock</h1>
            </a>
            <p>BELLEZA • CONFIANZA • BIENESTAR</p>
        </div>
    </header>

    <main class="shop-container">
        <div class="shop-header">
            <h2>Nuestros Productos</h2>
            <p>Cuidado facial profesional directo a tu rutina diaria</p>
        </div>

        <!-- Contenedor donde se cargarán los productos dinámicamente desde Firebase -->
        <div id="products-grid" class="products-grid">
            <div class="loading-state">Cargando productos de Blue Rock...</div>
        </div>
    </main>

    <!-- MÓDULO JAVASCRIPT DE FIREBASE -->
    <script type="module">
        // Importar módulos necesarios del SDK modular de Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ⚠️ REEMPLAZA ESTE OBJETO CON LAS CREDENCIALES DE TU PROYECTO DE FIREBASE
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "tu-proyecto.firebaseapp.com",
            projectId: "tu-proyecto-id",
            storageBucket: "tu-proyecto.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef123456"
        };

        // Inicializar Firebase y Firestore
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Función para renderizar los productos desde la colección "productos"
        async function cargarProductos() {
            const gridContainer = document.getElementById('products-grid');
            
            try {
                // Referencia a la colección 'productos' en Firestore
                const querySnapshot = await getDocs(collection(db, "productos"));
                
                // Si la colección está vacía
                if (querySnapshot.empty) {
                    gridContainer.innerHTML = '<p class="empty-state">No hay productos disponibles por el momento.</p>';
                    return;
                }

                // Limpiar mensaje de carga
                gridContainer.innerHTML = '';

                // Recorrer los documentos recibidos
                querySnapshot.forEach((doc) => {
                    const producto = doc.data();
                    
                    // Crear la tarjeta de producto
                    const productCard = document.createElement('div');
                    productCard.className = 'product-card';
                    productCard.innerHTML = `
                        <div class="product-image-wrap">
                            <img src="${producto.imagen || 'https://via.placeholder.com/300'}" alt="${producto.nombre}">
                        </div>
                        <div class="product-info">
                            <span class="product-category">${producto.categoria || 'Cuidado Facial'}</span>
                            <h3 class="product-title">${producto.nombre}</h3>
                            <p class="product-description">${producto.descripcion || ''}</p>
                            <div class="product-bottom">
                                <span class="product-price">$${producto.precio}</span>
                                <button class="btn-add" onclick="agregarAlCarrito('${doc.id}')">Agregar</button>
                            </div>
                        </div>
                    `;
                    gridContainer.appendChild(productCard);
                });

            } catch (error) {
                console.error("Error al obtener los productos: ", error);
                gridContainer.innerHTML = '<p class="error-state">Error al cargar la tienda. Revisa la configuración de Firebase.</p>';
            }
        }

        // Ejecutar carga de productos al iniciar
        window.addEventListener('DOMContentLoaded', cargarProductos);
    </script>
</body>
</html>
