<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/SignUp.css">
    <title>Registro - Blue Rock</title>
</head>
<body>

    <header>
        <div class="logo">
            <a href="index.html">  
                <h1 class="titulo-logo">Blue Rock</h1>
            </a>
            <p>BELLEZA • CONFIANZA • BIENESTAR</p>
        </div>
    </header>

    <!-- Contenedor principal para el centrado absoluto con Flexbox -->
    <main class="login-container">
        
        <div class="login-card">

            <!-- Formulario de Registro -->
            <form class="login-form" id="registro-form">
                
                <div class="form-group">
                    <label for="email">Correo Electrónico (Tu Usuario)</label>
                    <input type="email" id="email" placeholder="bluerock@correo.com" required>
                </div>

                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" placeholder="Anthony" required>
                </div>

                <div class="form-group">
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" placeholder="Mercado" required>
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" placeholder="849-555-5555" required>
                </div>

                <div class="form-group">
                    <label for="fecha">Fecha de Nacimiento</label>
                    <input type="date" id="fecha" required>
                </div>  

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="************" minlength="6" required>
                </div>

                <!-- Mensajes de estado (éxito o error) -->
                <div id="mensaje-estado" style="display: none; text-align: center; font-size: 0.85rem; padding: 10px; border-radius: 6px; margin-top: 10px;"></div>

                <button type="submit" class="btn-submit" id="btn-registrar">Crear Cuenta</button>
            </form>

        </div>

    </main>

    <!-- MÓDULO CONEXIÓN CON FIREBASE -->
    <script type="module">
        // 1. Importar SDK principal de Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        
        // 2. Importar funciones necesarias para Autenticación
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        
        // 3. Importar funciones necesarias para Firestore (Base de datos)
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Tus credenciales reales de Firebase para Blue Rock
        const firebaseConfig = {
            apiKey: "AIzaSyArRVa6N2XNwdYQKiR7drCqECMczH-JPQ0",
            authDomain: "bluerock-ee20b.firebaseapp.com",
            projectId: "bluerock-ee20b",
            storageBucket: "bluerock-ee20b.firebasestorage.app",
            messagingSenderId: "944470168965",
            appId: "1:944470168965:web:2d7cfd42773b9573d060ec"
        };

        // Inicializar Firebase, Auth y Firestore
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Capturar elementos del DOM
        const form = document.getElementById('registro-form');
        const mensajeBox = document.getElementById('mensaje-estado');
        const btnSubmit = document.getElementById('btn-registrar');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Bloquear botón durante la petición
            btnSubmit.disabled = true;
            btnSubmit.textContent = "Registrando...";
            mensajeBox.style.display = "none";

            // Obtener datos ingresados
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const nombre = document.getElementById('nombre').value;
            const apellido = document.getElementById('apellido').value;
            const telefono = document.getElementById('telefono').value;
            const fechaNacimiento = document.getElementById('fecha').value;

            try {
                // Step 1: Crear usuario en Firebase Auth
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Step 2: Guardar perfil en la colección "usuario" en Firestore
                await setDoc(doc(db, "usuario", user.uid), {
                    nombre: nombre,
                    apellido: apellido,
                    email: email,
                    telefono: telefono,
                    fechaNacimiento: fechaNacimiento,
                    rol: "cliente",
                    fechaRegistro: new Date()
                });

                // Notificación visual de éxito
                mensajeBox.style.display = "block";
                mensajeBox.style.backgroundColor = "#E8F5E9";
                mensajeBox.style.color = "#2E7D32";
                mensajeBox.textContent = "¡Registro exitoso! Redireccionando...";

                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1500);

            } catch (error) {
                console.error("Error en el registro:", error);

                mensajeBox.style.display = "block";
                mensajeBox.style.backgroundColor = "#FFEBEE";
                mensajeBox.style.color = "#C62828";

                if (error.code === 'auth/email-already-in-use') {
                    mensajeBox.textContent = "Este correo ya está registrado. Intenta iniciar sesión.";
                } else if (error.code === 'auth/weak-password') {
                    mensajeBox.textContent = "La contraseña debe tener al menos 6 caracteres.";
                } else {
                    mensajeBox.textContent = "Ocurrió un error al crear la cuenta. Revisa tu conexión o intenta de nuevo.";
                }

                btnSubmit.disabled = false;
                btnSubmit.textContent = "Crear Cuenta";
            }
        });
    </script>

</body>
</html>
