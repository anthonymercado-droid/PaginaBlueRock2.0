<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/SignUp.css">
    <title>Registro - Blue Rock</title>
</head>
<body>

    <header>
        <div class="logo">
            <a href="index.html">  
                <h1 class="titulo-logo">Blue Rock</h1>
            </a>
            <p>BELLEZA • CONFIANZA • BIENESTAR</p>
        </div>
    </header>

    <!-- Contenedor principal para el centrado absoluto con Flexbox -->
    <main class="login-container">
        
        <div class="login-card">

            <!-- Formulario de Registro -->
            <form class="login-form" id="registro-form">
                
                <div class="form-group">
                    <label for="email">Correo Electrónico (Tu Usuario)</label>
                    <input type="email" id="email" placeholder="bluerock@correo.com" required>
                </div>

                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" placeholder="Anthony" required>
                </div>

                <div class="form-group">
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" placeholder="Mercado" required>
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" placeholder="849-555-5555" required>
                </div>

                <div class="form-group">
                    <label for="fecha">Fecha de Nacimiento</label>
                    <input type="date" id="fecha" required>
                </div>  

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="************" minlength="6" required>
                </div>

                <!-- Mensajes de estado (éxito o error) -->
                <div id="mensaje-estado" style="display: none; text-align: center; font-size: 0.85rem; padding: 10px; border-radius: 6px; margin-top: 10px;"></div>

                <button type="submit" class="btn-submit" id="btn-registrar">Crear Cuenta</button>
            </form>

        </div>

    </main>

    <!-- MÓDULO CONEXIÓN CON FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ⚠️ REEMPLAZA ESTO CON TUS CREDENCIALES DE LA CONSOLA DE FIREBASE
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "tu-proyecto.firebaseapp.com",
            projectId: "tu-proyecto-id",
            storageBucket: "tu-proyecto.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Capturar el formulario
        const form = document.getElementById('registro-form');
        const mensajeBox = document.getElementById('mensaje-estado');
        const btnSubmit = document.getElementById('btn-registrar');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Bloquear botón para evitar múltiples clics
            btnSubmit.disabled = true;
            btnSubmit.textContent = "Registrando...";
            mensajeBox.style.display = "none";

            // Obtener los valores ingresados por el usuario
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const nombre = document.getElementById('nombre').value;
            const apellido = document.getElementById('apellido').value;
            const telefono = document.getElementById('telefono').value;
            const fechaNacimiento = document.getElementById('fecha').value;

            try {
                // 1. Crear el usuario en Firebase Authentication (Email + Password)
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 2. Guardar los datos adicionales del perfil en Firestore (Colección "usuarios")
                await setDoc(doc(db, "usuarios", user.uid), {
                    nombre: nombre,
                    apellido: apellido,
                    email: email,
                    telefono: telefono,
                    fechaNacimiento: fechaNacimiento,
                    rol: "cliente",
                    fechaRegistro: new Date()
                });

                // Mostrar mensaje de éxito
                mensajeBox.style.display = "block";
                mensajeBox.style.backgroundColor = "#E8F5E9";
                mensajeBox.style.color = "#2E7D32";
                mensajeBox.textContent = "¡Registro exitoso! Redireccionando...";

                // Redireccionar al usuario tras 1.5 segundos
                setTimeout(() => {
                    window.location.href = "agendar-cita.html"; // O a la tienda.html
                }, 1500);

            } catch (error) {
                console.error("Error en el registro:", error);

                mensajeBox.style.display = "block";
                mensajeBox.style.backgroundColor = "#FFEBEE";
                mensajeBox.style.color = "#C62828";

                // Manejo de errores comunes de Firebase Auth
                if (error.code === 'auth/email-already-in-use') {
                    mensajeBox.textContent = "Este correo ya está registrado. Intenta iniciar sesión.";
                } else if (error.code === 'auth/weak-password') {
                    mensajeBox.textContent = "La contraseña debe tener al menos 6 caracteres.";
                } else {
                    mensajeBox.textContent = "Ocurrió un error al crear la cuenta. Intenta de nuevo.";
                }

                btnSubmit.disabled = false;
                btnSubmit.textContent = "Crear Cuenta";
            }
        });
    </script>

</body>
</html>
