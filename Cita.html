<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva tu Cita - Blue Rock</title>
    
    <!-- Fuentes Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Archivo CSS -->
    <link rel="stylesheet" href="css/Agendar.css">
</head>
<body>

    <header>
        <div class="logo">
            <a href="index.html">  
                <h1 class="titulo-logo">Blue Rock</h1>
            </a>
            <p>BELLEZA • CONFIANZA • BIENESTAR</p>
        </div>
    </header>

    <div class="booking-container">
        <div class="booking-header">
            <h2>Reserva tu Cita</h2>
            <p>Selecciona el tratamiento, fecha y horario que mejor se adapte a ti</p>
        </div>

        <form action="Cita.html" method="GET">
            
            <!-- PASO 1: SELECCIÓN DE SERVICIO -->
            <div class="booking-section">
                <h3><span class="step-num">1</span> Selecciona un Servicio</h3>
                <div class="services-grid">
                    <label class="service-card">
                        <input type="radio" name="servicio" value="limpieza" required>
                        <div class="card-content">
                            <span class="service-icon">✨</span>
                            <span class="service-title">Limpieza Facial Profunda</span>
                            <span class="service-duration">60 min</span>
                        </div>
                    </label>

                    <label class="service-card">
                        <input type="radio" name="servicio" value="hidratacion">
                        <div class="card-content">
                            <span class="service-icon">💧</span>
                            <span class="service-title">Hidratación Intensiva</span>
                            <span class="service-duration">45 min</span>
                        </div>
                    </label>

                    <label class="service-card">
                        <input type="radio" name="servicio" value="antiacne">
                        <div class="card-content">
                            <span class="service-icon">🌿</span>
                            <span class="service-title">Tratamiento Anti-Acné</span>
                            <span class="service-duration">60 min</span>
                        </div>
                    </label>

                    <label class="service-card">
                        <input type="radio" name="servicio" value="rejuvenecimiento">
                        <div class="card-content">
                            <span class="service-icon">🌟</span>
                            <span class="service-title">Rejuvenecimiento Facial</span>
                            <span class="service-duration">90 min</span>
                        </div>
                    </label>
                </div>
            </div>

            <!-- PASO 2: FECHA Y HORA -->
            <div class="booking-section">
                <h3><span class="step-num">2</span> Fecha y Hora</h3>
                <div class="datetime-grid">
                    
                    <div class="form-group">
                        <label for="fecha">Fecha de la cita:</label>
                        <input type="date" id="fecha" name="fecha" required>
                    </div>

                    <div class="form-group">
                        <label>Horario disponible:</label>
                        <div class="time-slots">
                            <label class="time-chip">
                                <input type="radio" name="hora" value="09:00" required>
                                <span>09:00 AM</span>
                            </label>
                            <label class="time-chip">
                                <input type="radio" name="hora" value="10:30">
                                <span>10:30 AM</span>
                            </label>
                            <label class="time-chip">
                                <input type="radio" name="hora" value="12:00">
                                <span>12:00 PM</span>
                            </label>
                            <label class="time-chip">
                                <input type="radio" name="hora" value="15:00">
                                <span>03:00 PM</span>
                            </label>
                            <label class="time-chip">
                                <input type="radio" name="hora" value="16:30">
                                <span>04:30 PM</span>
                            </label>
                            <label class="time-chip">
                                <input type="radio" name="hora" value="18:00">
                                <span>06:00 PM</span>
                            </label>
                        </div>
                    </div>

                </div>
            </div>

            <!-- PASO 3: DATOS DE CONTACTO RÁPIDOS -->
            <div class="booking-section">
                <h3><span class="step-num">3</span> Tus Datos de Contacto</h3>
                <div class="contact-grid">
                    <div class="form-group">
                        <label for="nombre">Nombre completo:</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Ej. Ana García" required>
                    </div>
                    <div class="form-group">
                        <label for="telefono">Teléfono / WhatsApp:</label>
                        <input type="tel" id="telefono" name="telefono" placeholder="Ej. +52 55 1234 5678" required>
                    </div>
                    <div class="form-group full-width">
                        <label for="correo">Correo electrónico:</label>
                        <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-submit">Continuar a la Ficha de Salud ➔</button>
        </form>
    </div>

</body>
</html>
